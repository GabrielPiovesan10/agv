<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva Premium | Agenda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="agendaa.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🍽️</span>
                <h1>L'Étoile <span class="highlight">Reserva</span></h1>
            </div>
            <p class="subtitle">Agende sua experiência gastronômica inesquecível</p>
        </header>

        <main class="main-content">
            <!-- Form Section -->
            <section class="booking-section card glass">
                <h2>Nova Reserva</h2>
                <form id="booking-form">
                    <div class="form-group">
                        <label for="name">Nome Completo</label>
                        <input type="text" id="name" name="name" placeholder="Ex: João da Silva" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Telefone</label>
                            <input type="tel" id="phone" name="phone" placeholder="(11) 99999-9999" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="date">Data da Reserva</label>
                            <input type="date" id="date" name="date" required>
                        </div>
                        <div class="form-group">
                            <label for="time">Horário</label>
                            <select id="time" name="time" required disabled>
                                <option value="" disabled selected>Selecione uma data primeiro</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="guests">Número de Pessoas</label>
                        <div class="guests-selector">
                            <button type="button" class="btn-icon" id="btn-minus">−</button>
                            <input type="number" id="guests" name="guests" value="2" min="1" max="20" readonly>
                            <button type="button" class="btn-icon" id="btn-plus">+</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="notes">Pedidos Especiais (Opcional)</label>
                        <textarea id="notes" name="notes" rows="3" placeholder="Alergias, aniversário, mesa preferida..."></textarea>
                    </div>

                    <button type="submit" class="btn-primary">Confirmar Reserva</button>
                    <div id="form-message" class="message hidden"></div>
                </form>
            </section>

            <!-- Events List Section -->
            <section class="agenda-section card glass">
                <h2>Próximas Reservas</h2>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">Todas</button>
                    <button class="filter-btn" data-filter="today">Hoje</button>
                    <button class="filter-btn" data-filter="upcoming">Futuras</button>
                </div>
                
                <div class="events-list" id="events-list">
                    <!-- Events will be populated here via JS -->
                    <div class="empty-state">
                        <p>Nenhuma reserva encontrada.</p>
                    </div>
                </div>
            </section>
        </main>
        
        <footer class="footer">
            <p>&copy; <span id="current-year"></span> L'Étoile Restaurante. Todos os direitos reservados.</p>
        </footer>
    </div>
    
    <script src="agendaa.js"></script>
</body>
</html>
