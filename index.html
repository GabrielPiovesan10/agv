<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Eventos | Administração</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="agendaa.css">
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar / Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🎸</span>
                <h1>Admin<span class="highlight">Shows</span></h1>
            </div>
            <p class="subtitle">Gestão de Agenda e Música ao Vivo</p>
        </header>

        <main class="main-content">
            <!-- Cadastrar Evento -->
            <section class="card glass">
                <div class="card-header">
                    <h2>📅 Agendar Novo Evento</h2>
                </div>
                
                <form id="event-form">
                    <div class="form-group">
                        <label for="eventName">Nome do Evento / Atração (Banda, Cantor...)</label>
                        <input type="text" id="eventName" required placeholder="Ex: Banda Rota 66">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="eventDate">Data</label>
                            <input type="date" id="eventDate" required>
                        </div>
                        <div class="form-group">
                            <label for="eventTime">Horário de Início</label>
                            <input type="time" id="eventTime" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="couvert">Valor do Couvert (R$)</label>
                            <input type="number" id="couvert" min="0" step="0.50" placeholder="Ex: 15.00">
                        </div>
                        <div class="form-group">
                            <label for="cache">Cachê do Artista (R$)</label>
                            <input type="number" id="cache" min="0" step="10" placeholder="Ex: 500.00">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="notes">Observações / Detalhes</label>
                        <textarea id="notes" rows="3" placeholder="Ex: Precisam de 2 microfones, chegam as 18h para passagem de som..."></textarea>
                    </div>

                    <button type="submit" class="btn-primary">Salvar na Agenda</button>
                    <div id="form-message" class="message hidden"></div>
                </form>
            </section>

            <!-- Lista de Eventos -->
            <section class="card glass list-section">
                <div class="card-header">
                    <h2>📋 Agenda de Eventos</h2>
                    <div class="filters">
                        <button class="filter-btn active" data-filter="upcoming">Próximos</button>
                        <button class="filter-btn" data-filter="past">Concluídos</button>
                        <button class="filter-btn" data-filter="all">Todos</button>
                    </div>
                </div>
                
                <div class="events-container" id="events-list">
                    <!-- Cards de eventos renderizados via JS -->
                </div>
            </section>
        </main>
    </div>
    
    <script src="agendaa.js"></script>
</body>
</html>
